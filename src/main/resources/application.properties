spring.application.name=biblioteca

# comando que bloquea la autoconfiguración de la base de datos, para que no intente conectarse a una base de datos que no existe
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.

server.port=8080

spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=biblioteca
spring.datasource.password=${DB_PASS}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true